<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>COMART 官網後台</title>
<link rel="icon" type="image/png" href="../assets/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&family=Inter:wght@300..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<!-- ============ 登入 ============ -->
<div class="login" id="login">
  <form class="login__card" id="loginForm">
    <img class="login__logo" src="../assets/img/comart-logo.png" alt="COMART">
    <h1>官網內容後台</h1>
    <p class="login__sub">Website Content Management</p>

    <label for="lgEmail">Email</label>
    <input type="email" id="lgEmail" autocomplete="username" placeholder="you@comart.com.tw">

    <label for="lgPass">密碼</label>
    <input type="password" id="lgPass" autocomplete="current-password" placeholder="••••••••">

    <button class="btn btn--primary" type="submit">登入</button>

    <p class="login__note" id="loginNote">
      <b>目前為離線示範模式。</b>資料庫與 Supabase Auth 尚未建置，
      任何帳號密碼都會直接進入後台，所有編輯只存在這台瀏覽器的 localStorage，
      不會寫入伺服器、也不會影響線上網站。
    </p>
  </form>
</div>

<!-- ============ 後台主體 ============ -->
<div class="app" id="app" hidden>
  <aside class="side">
    <div class="side__brand">
      <img src="../assets/img/comart-logo.png" alt="COMART">
      <span>官網後台</span>
    </div>

    <nav class="side__nav">
      <button class="snav is-on" data-view="dashboard"><span class="i">◧</span>總覽</button>
      <button class="snav" data-view="pages"><span class="i">▤</span>頁面內容</button>
      <button class="snav" data-view="news"><span class="i">✦</span>公司動態</button>
      <button class="snav" data-view="products"><span class="i">▦</span>產品上架</button>
      <button class="snav" data-view="enquiries"><span class="i">✉</span>詢價紀錄</button>
      <button class="snav" data-view="settings"><span class="i">⚙</span>設定</button>
    </nav>

    <div class="side__foot">
      <div class="side__mode" id="modeBadge">離線示範模式</div>
      <a class="side__link" href="../" target="_blank" rel="noopener">前往官網 ↗</a>
      <button class="side__link" id="logout">登出</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <h2 id="viewTitle">總覽</h2>
        <p id="viewDesc">網站內容與產品上架狀態</p>
      </div>
      <div class="topbar__actions" id="topActions"></div>
    </header>

    <div class="body" id="viewBody"></div>
  </main>
</div>

<script src="admin.js"></script>
</body>
</html>
